name: Build Shrec228 Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Mod
        run: gradle build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Shrec228Client-26.1.2
          path: build/libs/*.jar
